<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retiro · 404</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f0e1; color: #23212c;
      font: 300 17px/1.45 "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.01em; }
    main { max-width: 30rem; padding: 24px; }
    .marca { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(35, 33, 44, 0.62); }
    h1 { margin: 0 0 12px; font-weight: 300; font-size: 40px; letter-spacing: -0.03em; color: #006434; }
    a { color: #006434; }
  </style>
</head>
<body>
  <main>
    <p class="marca">Retiro</p>
    <h1>Página no encontrada</h1>
    <p>Esta dirección no existe. <a id="volta" href="./">Volver al gemelo digital</a>.</p>
    <p lang="en">Page not found. <a id="back" href="./">Back to the digital twin</a>.</p>
  </main>
  <script>
    // GitHub Pages serve este ficheiro em qualquer caminho em falta: a raiz do site é o primeiro segmento (/<repo>/)
    var seg = location.pathname.split("/").filter(Boolean);
    var raiz = seg.length ? "/" + seg[0] + "/" : "/";
    document.getElementById("volta").href = document.getElementById("back").href = raiz;
  </script>
</body>
</html>
